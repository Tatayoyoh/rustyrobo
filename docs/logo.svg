<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="rustyrobo logo">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F28C45"/>
      <stop offset="0.5" stop-color="#D0532F"/>
      <stop offset="1" stop-color="#A63A22"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C3A22"/>
      <stop offset="1" stop-color="#7A2A18"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E8270"/>
      <stop offset="1" stop-color="#6D6253"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#C9FFF2"/>
      <stop offset="0.55" stop-color="#6FE3C8"/>
      <stop offset="1" stop-color="#2BAE93"/>
    </radialGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="512" cy="975" rx="200" ry="16" fill="#000" opacity="0.18"/>

  <!-- arms (iron) -->
  <path d="M245 430 A225 225 0 0 0 230 760" fill="none" stroke="url(#iron)" stroke-width="58" stroke-linecap="round"/>
  <path d="M779 430 A225 225 0 0 1 794 760" fill="none" stroke="url(#iron)" stroke-width="58" stroke-linecap="round"/>

  <!-- shoulders -->
  <circle cx="258" cy="455" r="72" fill="url(#dark)"/>
  <circle cx="766" cy="455" r="72" fill="url(#dark)"/>

  <!-- claws -->
  <g fill="url(#body)" stroke="#7A2A18" stroke-width="3">
    <path d="M325 742 c-60 -58 -150 -45 -170 25 c-18 62 35 100 85 92 c22 -4 26 -38 4 -46 c-30 -6 -50 -28 -38 -55 c12 -26 45 -26 66 -6 c22 18 72 -4 53 -10 z"/>
    <path d="M699 742 c60 -58 150 -45 170 25 c18 62 -35 100 -85 92 c-22 -4 -26 -38 -4 -46 c30 -6 50 -28 38 -55 c-12 -26 -45 -26 -66 -6 c-22 18 -72 -4 -53 -10 z"/>
  </g>

  <!-- lower body -->
  <circle cx="507" cy="766" r="78" fill="url(#iron)" stroke="#5B5144" stroke-width="3"/>
  <ellipse cx="507" cy="680" rx="160" ry="120" fill="url(#dark)"/>

  <!-- head: the drop -->
  <path d="M508 20 C 380 120, 250 280, 250 450 A 258 300 0 0 0 766 450 C 766 280, 640 120, 508 20 Z" fill="url(#body)" stroke="#8A3020" stroke-width="3"/>

  <!-- rust patina -->
  <g fill="#8A3020" opacity="0.45">
    <circle cx="350" cy="560" r="16"/>
    <circle cx="378" cy="590" r="9"/>
    <circle cx="660" cy="300" r="12"/>
    <circle cx="640" cy="620" r="7"/>
  </g>
  <g fill="#F7B267" opacity="0.55">
    <circle cx="430" cy="210" r="9"/>
    <circle cx="610" cy="520" r="6"/>
  </g>

  <!-- eye -->
  <circle cx="512" cy="425" r="112" fill="#3A1A12"/>
  <circle cx="512" cy="425" r="96" fill="#BFFFF0"/>
  <circle cx="512" cy="425" r="82" fill="url(#lens)"/>
  <circle cx="512" cy="425" r="36" fill="#2BAE93" opacity="0.55"/>
  <circle cx="484" cy="390" r="22" fill="#FFFFFF" opacity="0.8"/>

  <!-- grille -->
  <g fill="#7A2A18">
    <path d="M431 585 h16 v42 l-16 -8 z"/>
    <rect x="465" y="585" width="18" height="58" rx="2"/>
    <rect x="501" y="585" width="18" height="63" rx="2"/>
    <rect x="537" y="585" width="18" height="58" rx="2"/>
    <path d="M573 585 h16 v34 l-16 8 z"/>
  </g>

  <!-- rivets -->
  <g fill="#F7B267">
    <circle cx="330" cy="455" r="8"/>
    <circle cx="694" cy="455" r="8"/>
    <circle cx="420" cy="690" r="7"/>
    <circle cx="604" cy="690" r="7"/>
  </g>

  <!-- small Rust cog on the tip -->
  <g transform="translate(508 96)">
    <g fill="#7A2A18">
      <circle r="26"/>
      <rect x="-7" y="-38" width="14" height="16" rx="3"/>
      <rect x="-7" y="22" width="14" height="16" rx="3"/>
      <rect x="-38" y="-7" width="16" height="14" rx="3"/>
      <rect x="22" y="-7" width="16" height="14" rx="3"/>
      <g transform="rotate(45)">
        <rect x="-7" y="-38" width="14" height="16" rx="3"/>
        <rect x="-7" y="22" width="14" height="16" rx="3"/>
        <rect x="-38" y="-7" width="16" height="14" rx="3"/>
        <rect x="22" y="-7" width="16" height="14" rx="3"/>
      </g>
    </g>
    <circle r="11" fill="#F7B267"/>
  </g>
</svg>
