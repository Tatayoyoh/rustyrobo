[package]
name = "rustyrobo"
version = "1.3.0"
edition = "2024"
description = "Native MongoDB management tool — a Rust port of Robomongo (Robo 3T)"
license = "Apache-2.0"
repository = "https://github.com/Tatayoyoh/rustyrobo"
homepage = "https://tatayoyoh.github.io/rustyrobo/"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bson = { version = "2.15", features = ["chrono-0_4"] }
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }
egui_extras = "0.36.2"
flate2 = "1.1.11"
fontdb = "0.23"
futures-util = "0.3.34"
hex = "0.4"
memmap2 = "0.9"
mongodb = { version = "3.9.1", features = ["cert-key-password"] }
# Driver 2.x is kept for servers older than 4.4 (wire version < 9): 3.6, 4.0, 4.2.
mongodb_legacy = { version = "2.8", package = "mongodb" }
parking_lot = "0.12.5"
percent-encoding = "2.3"
png = "0.17"
rfd = "0.17.2"
rquickjs = { version = "0.14.0", features = ["classes", "properties", "std"], default-features = false }
russh = "0.64.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
# Same version as egui: a font it can read is a font egui can read.
skrifa = "0.44"
tar = "0.4.46"
tokio = { version = "1.54.0", features = ["full"] }
unicode-bidi = "0.3"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
crossbeam-channel = "0.5.17"
egui_kittest = { version = "0.36.2", features = ["eframe"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
self-replace = "1.5.1"
