name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: dev/ssh/gen-keys.sh && docker compose -f dev/docker-compose.yml up -d --wait
        env:
          MONGO_MODERN_IMAGE: mongo:7.0
      - run: RR_LIVE=1 cargo test --test live --test ui -- --test-threads=1
      - name: Container logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml ps -a && docker compose -f dev/docker-compose.yml logs --no-color --tail 200
